[project]
name = "lan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhipatil1122", email = "patilabhishek3484@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0.53",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client", "src/server", "src/shared"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]


